<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tenora Brand Assets</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1b18;
        color: #f6f2ea;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #203a34 0, #0b1b18 55%);
      }

      main {
        width: min(30rem, calc(100% - 3rem));
        text-align: center;
      }

      img {
        width: 9rem;
        height: 9rem;
        border-radius: 2rem;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
      }

      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 2rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        color: #b9c7c0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/tenora-icon.png" alt="Tenora" width="1024" height="1024" />
      <h1>Tenora</h1>
      <p>Official authentication and application branding.</p>
    </main>
  </body>
</html>
