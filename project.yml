name: Tenora
options:
  bundleIdPrefix: com.tenora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  Tenora:
    type: application
    platform: iOS
    info:
      path: Tenora/Resources/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.tenora.app
            CFBundleURLSchemes: [tenora]
    sources:
      - path: Tenora
      - path: Shared
    dependencies:
      - target: TenoraWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.app
        PRODUCT_NAME: Tenora
        CODE_SIGN_ENTITLEMENTS: Tenora/Resources/Tenora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tenora
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Tenora uses your calendar to show what is coming up and find time for tasks."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Tenora uses your calendar to show what is coming up and find time for tasks."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TenoraTests
        - TenoraUITests
  TenoraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TenoraWidgets
      - path: Shared
      - path: Tenora/Domain/Models/TenoraTask.swift
      - path: Tenora/Domain/Models/CalendarEvent.swift
      - path: Tenora/Domain/Services/TaskPriorityEngine.swift
      - path: Tenora/Domain/Services/AvailabilityEngine.swift
    info:
      path: TenoraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tenora
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.app.widgets
        CODE_SIGN_ENTITLEMENTS: TenoraWidgets/TenoraWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  TenoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TenoraUITests
    dependencies:
      - target: Tenora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.uitests
        GENERATE_INFOPLIST_FILE: YES
  TenoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TenoraTests
    dependencies:
      - target: Tenora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tenora.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tenora"
        BUNDLE_LOADER: "$(TEST_HOST)"
