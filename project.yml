name: Tenora
options:
  bundleIdPrefix: com.tenora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Tenora:
    type: application
    platform: iOS
    sources:
      - path: Tenora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.app
        PRODUCT_NAME: Tenora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tenora
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TenoraTests
  TenoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TenoraTests
    dependencies:
      - target: Tenora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenora.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tenora.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tenora"
        BUNDLE_LOADER: "$(TEST_HOST)"

